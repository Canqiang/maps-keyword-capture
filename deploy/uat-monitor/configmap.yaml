# Discover current linked keyword records daily. This list preserves historical store IDs only.
# Names are stored labels, not assertions of canonical business names. No static keyword pool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maps-keyword-monitor-config
  namespace: uat
data:
  monitor.json: |
    {
      "schemaVersion": "1",
      "sourceBaseUrl": "http://operation-assistant-api.uat.svc.cluster.local:80",
      "storeDiscovery": {
        "provider": "mongo",
        "database": "seo-integration",
        "collection": "local_keywords",
        "maxStores": 40,
        "maxRecords": 10000,
        "timeoutMs": 30000
      },
      "stores": [
        {
          "storeId": "choice-upper-west-side",
          "merchantId": "47c65660-ade7-4431-8d46-9ec9c58aef5b",
          "placeId": "ChIJH8iZh-5ZwokRPLzzADeSnYE",
          "name": "Choice Brooklyn - Upper West Side"
        },
        {
          "storeId": "choice-clinton-hill",
          "merchantId": "47c65660-ade7-4431-8d46-9ec9c58aef5b",
          "placeId": "ChIJaYcllU0N7ocR4lWiLngfEYg",
          "name": "Choice Market - Clinton Hill"
        },
        {
          "storeId": "only-bear",
          "merchantId": "04ef8b4c-4837-4cf2-a8f5-0c9228658376",
          "placeId": "ChIJgR0AKI2HwokRcMm_K7J7Phw",
          "name": "Only Bear Chicken & Boba"
        },
        {
          "storeId": "keke-flushing",
          "merchantId": "29742a52-d824-469b-a395-52084345b7ad",
          "placeId": "ChIJRTD3Ws5hwokRES78IFU7zW0",
          "name": "Keke Food 可可小卤 — Flushing"
        },
        {
          "storeId": "george-merchant",
          "merchantId": "54b78da8-4d71-4576-8f59-915e7bd94561",
          "placeId": "ChIJqVId_y1ZwokRjPCG1MQuKmg",
          "name": "George Merchant"
        },
        {
          "storeId": "massage-float",
          "merchantId": "4ccdade0-dd69-4853-809f-2fd25ae65030",
          "placeId": "ChIJzfqHtwq7uokRvkBKgpmXPiM",
          "name": "Massage & float"
        },
        {
          "storeId": "szechuan-gourmet",
          "merchantId": "ec3a8e03-28c0-4291-9f94-14289e63cdc7",
          "placeId": "ChIJZ4gQONX3wokRUd76p6byNOE",
