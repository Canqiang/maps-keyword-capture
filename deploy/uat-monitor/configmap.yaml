        }
      ],
      "maxKeywordsPerStore": 40,
      "batchSize": 20,
      "sourceTimeoutMs": 15000,
      "outputDirectory": "/work/outputs",
      "capture": {
        "maxResultsPerKeyword": 15,
        "maxScrollsPerKeyword": 10,
        "maxScreenshotsPerKeyword": 8,
        "keywordTimeoutMs": 90000,
        "locale": "en-US",
        "browserTimezoneId": "America/New_York",
        "filenameTimezone": "Asia/Shanghai",
        "viewport": {
          "width": 1440,
          "height": 1000
        }
      }
    }
