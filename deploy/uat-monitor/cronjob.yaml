# UAT only. Keep suspended until scoped acceptance and independent Azure readback are recorded.
# See docs/uat-monitor-operations.md for the release acceptance boundary.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-keyword-monitor-daily
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-monitor
    app.kubernetes.io/component: daily
spec:
  schedule: "0 0 * * *"
  timeZone: Asia/Shanghai
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0
      # 14-hour application deadline plus 600s for termination/finalization margin.
      activeDeadlineSeconds: 51000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-keyword-monitor
            app.kubernetes.io/component: daily
        spec:
          restartPolicy: Never
          nodeSelector:
            envpool: aiapp
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 300
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: monitor
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:59f7e7db45937ac6103972126e85fc827a06d73474f6144cb709bda194f38868
              args: ["node", "dist/monitor/cli.js", "--config", "/config/monitor.json", "--storage", "azure"]
              env:
                - name: IMAGE_DIGEST
                  value: sha256:59f7e7db45937ac6103972126e85fc827a06d73474f6144cb709bda194f38868
                - name: KEYWORD_MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: maps-keyword-monitor-source
                      key: KEYWORD_MONGO_URI
                - name: EGRESS_PROFILE_ID
                  value: aks-fbrdev-eastus2-aiapp
                - name: AZURE_STORAGE_CONTAINER
                  value: maps-keyword-capture-uat
                - name: AZURE_STORAGE_CONTAINER_SAS_URL
                  valueFrom:
                    secretKeyRef:
                      name: maps-keyword-monitor-storage
                      key: AZURE_STORAGE_CONTAINER_SAS_URL
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: config
              configMap:
                name: maps-keyword-monitor-config
            - name: work
              emptyDir: { sizeLimit: 2Gi }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 512Mi }
