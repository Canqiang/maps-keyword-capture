# Dev trial only: results stay on the Pod's emptyDir, so the container sleeps 15 minutes after the
# batch for `kubectl cp`. No Azure upload yet. Pods pull from ACR through the kubelet identity,
# like the other dev-ai workloads, so no imagePullSecrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: maps-capture-dev-trial-1
  namespace: dev-ai
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: dev-trial
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-keyword-capture
        app.kubernetes.io/component: dev-trial
    spec:
      restartPolicy: Never
      nodeSelector:
        envpool: aiapp
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: capture
          image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:9c7c86e3a329027befc540fb859ad6c5c332e4dd8d4d21e9f453c81a7b07433a
          # tini -g forwards signals to the whole process group, so node still receives SIGTERM.
          command: ["/usr/bin/tini", "-g", "--", "sh", "-c"]
          args:
            - |
              node dist/cli.js --config /config/keywords.json
              code=$?
              echo "CAPTURE_EXIT=$code"
              echo "Results kept under /work/outputs for 15 minutes for kubectl cp"
              sleep 900
              exit $code
          env:
            - name: IMAGE_DIGEST
              value: sha256:9c7c86e3a329027befc540fb859ad6c5c332e4dd8d4d21e9f453c81a7b07433a
            - name: EGRESS_PROFILE_ID
              value: aks-fbrdev-eastus2-aiapp
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: config
          configMap:
            name: maps-capture-dev-trial-keywords
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
