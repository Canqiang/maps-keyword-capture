# Tracking UI and API: store management, latest ranks, trends, grid heat maps and screenshots.
# ClusterIP only; open it with `kubectl -n uat port-forward svc/maps-tracking-ui 8080:80`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps-tracking-ui
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maps-keyword-capture
      app.kubernetes.io/component: tracking-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-keyword-capture
        app.kubernetes.io/component: tracking-ui
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        envpool: uatops
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: ui
          image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:ec39a2bdad8ce3d386f5be3d7d1f34142c0279474d39086a8b6f2e4130621daf
          args: ["node", "dist/web/server.js"]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: PORT, value: "8080" }
            - { name: TRACKING_CONFIG, value: /config/tracking.json }
            - name: MAPS_TRACKING_MONGO_URI
              valueFrom:
                secretKeyRef: { name: maps-keyword-monitor-source, key: KEYWORD_MONGO_URI }
            - { name: AZURE_STORAGE_CONTAINER, value: maps-keyword-capture-uat }
            - name: AZURE_STORAGE_CONTAINER_SAS_URL
              valueFrom:
                secretKeyRef: { name: maps-keyword-monitor-storage, key: AZURE_STORAGE_CONTAINER_SAS_URL }
            - { name: HOME, value: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: maps-tracking-config }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: maps-tracking-ui
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
  ports:
    - { name: http, port: 80, targetPort: http }
