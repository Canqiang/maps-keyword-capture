# "Collect now" button: the UI creates one-off Jobs from the existing CronJob templates.
# It can read CronJobs and read/create Jobs in uat; nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maps-tracking-ui
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maps-tracking-ui-scan-trigger
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maps-tracking-ui-scan-trigger
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-ui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maps-tracking-ui-scan-trigger
subjects:
  - kind: ServiceAccount
    name: maps-tracking-ui
    namespace: uat
