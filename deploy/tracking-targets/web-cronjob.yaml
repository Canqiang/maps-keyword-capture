# Candidate template: replace REPLACE_DIGEST_WEB with the verified ACR digest before applying.
# Separate names/configuration preserve the legacy tracking and daily collectors.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-targets-web-2h
  namespace: uat
  labels: &labels
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: targets-web
# Two-hour Web cadence; preserve the active Job and verify current-catalog capacity before live rollout.
# 2026-10-22: the single web scan for every store. Stores, monitored keywords, targets and points are read from
# Mongo (tracking.json storeSource monitor-target-stores-v1) at the start of each run, i.e. what the UI settings page saves.
spec:
  schedule: "15 */2 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 12
  suspend: false
  jobTemplate:
    metadata:
      labels: *labels
    spec:
      completionMode: Indexed
      completions: 3
      parallelism: 3
      backoffLimitPerIndex: 0
      maxFailedIndexes: 3
      activeDeadlineSeconds: 6600
      # Keep finished Jobs (and their Pod logs) for one day so failed runs can be inspected after
      # the fact; the 2026-11-07 outage was invisible because failures disappeared after 10 minutes.
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
          automountServiceAccountToken: false
          nodeSelector: { envpool: uatops }
          securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001 }
          containers:
            - name: tracking
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:REPLACE_DIGEST_WEB
              args:
                - node
                - dist/domain/cli.js
                - scan
                - --config
                - /config/tracking.json
                - --surface
                - web
                - --tier
                - point
                - --storage
                - azure
                - --output-dir
                - /work/outputs
                - --mongo-uri-env
                - MAPS_TRACKING_MONGO_URI
                - --shard-count
                - "3"
                - --shard-strategy
                - balanced
              env:
                - { name: TRACKING_SCAN_GROUP, value: uat/maps-targets-web-2h }
                - name: JOB_UID
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']" } }
                - { name: IMAGE_DIGEST, value: "sha256:REPLACE_DIGEST_WEB" }
                - { name: EGRESS_PROFILE_ID, value: aks-fbrdev-eastus2-uatops }
                - { name: AZURE_STORAGE_CONTAINER, value: maps-keyword-capture-uat }
                - name: AZURE_STORAGE_CONTAINER_SAS_URL
                  valueFrom:
                    secretKeyRef: { name: maps-keyword-monitor-storage, key: AZURE_STORAGE_CONTAINER_SAS_URL }
                - name: MAPS_TRACKING_MONGO_URI
                  valueFrom:
                    secretKeyRef: { name: maps-keyword-monitor-source, key: KEYWORD_MONGO_URI }
                - { name: HOME, value: /tmp }
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef: { fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']" }
              resources:
                requests: { cpu: 250m, memory: 1Gi, ephemeral-storage: 512Mi }
                limits: { cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: config
              configMap: { name: maps-targets-web-located-beb1467 }
            - { name: work, emptyDir: { sizeLimit: 2Gi } }
            - { name: tmp, emptyDir: { sizeLimit: 1Gi } }
            - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Mi } }
