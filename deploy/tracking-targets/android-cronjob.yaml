# Candidate template: replace REPLACE_DIGEST_ANDROID with the verified ACR digest before applying.
# Requires two verified /runtime/monitor-workers/{0,1} clones on the retained android-runtime PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-targets-android-daily
  namespace: android-maps-pilot
  labels: &labels
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: targets-android
# 2026-10-22: one daily pass over every store in Mongo (the settings page), base keywords only. A native
# query takes ~4.4 minutes (first scheduled run). The namespace ResourceQuota (android-quota.yaml) admits two
# emulator Pods on the crawler node, so the scan runs on two workers.
spec:
  schedule: "0 21 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 12
  suspend: true
  jobTemplate:
    metadata:
      labels: *labels
    spec:
      completionMode: Indexed
      completions: 2
      parallelism: 2
      backoffLimitPerIndex: 0
      maxFailedIndexes: 2
      activeDeadlineSeconds: 64800
      # Delete the finished Job and its Pods 10 minutes after it ends (success or failure); results live in Azure/Mongo.
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels: *labels
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
          automountServiceAccountToken: false
          nodeSelector: { envpool: crawler }
          tolerations:
            - { key: maps-capture, operator: Equal, value: android, effect: NoSchedule }
          # No Pod fsGroup: do not recursively chown historical SDK/userdata on this shared PVC.
          initContainers:
            - name: prepare-work
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture-android@sha256:REPLACE_DIGEST_ANDROID
              command: [python3, -c, "import os; os.chown('/work', 1001, 1001); os.chmod('/tmp', 0o1777)"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL], add: [CHOWN, FOWNER] }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
            - name: android-runtime
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture-android@sha256:REPLACE_DIGEST_ANDROID
              restartPolicy: Always
              command: [python3, /app/deploy/android/linux/tracking_sidecar.py]
              env:
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef: { fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']" }
                - { name: HOME, value: /tmp }
              startupProbe:
                exec:
                  command: [python3, -c, "from pathlib import Path; raise SystemExit(0 if Path('/tmp/android-ready').is_file() else 1)"]
                periodSeconds: 5
                timeoutSeconds: 2
                # 180 s stagger (worker 1) + 510 s boot + 240 s Appium < 1000 s.
                failureThreshold: 200
              resources:
                requests: { cpu: 1500m, memory: 5Gi, ephemeral-storage: 256Mi }
                limits: { cpu: "2", memory: 6Gi, ephemeral-storage: 1Gi }
              securityContext:
                runAsUser: 0
                privileged: true
                readOnlyRootFilesystem: true
              volumeMounts:
                - { name: runtime, mountPath: /runtime }
                - { name: runtime, mountPath: /runtime/sdk, subPath: sdk, readOnly: true }
                - { name: kvm, mountPath: /dev/kvm }
                - { name: tmp, mountPath: /tmp }
                - { name: dshm, mountPath: /dev/shm }
          containers:
            - name: tracking
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture-android@sha256:REPLACE_DIGEST_ANDROID
              command: [node]
              args:
                - dist/domain/cli.js
                - scan
                - --config
                - /config/tracking.json
                - --surface
                - android
                - --tier
                - point
                - --storage
                - azure
                - --output-dir
                - /work/outputs
                - --mongo-uri-env
                - MAPS_TRACKING_MONGO_URI
                - --shard-count
                - "2"
                - --shard-strategy
                - balanced
              env:
                - { name: IMAGE_DIGEST, value: "sha256:REPLACE_DIGEST_ANDROID" }
                - { name: EGRESS_PROFILE_ID, value: aks-fbrdev-eastus2-crawler }
                - { name: AZURE_STORAGE_CONTAINER, value: maps-keyword-capture-uat }
                - name: AZURE_STORAGE_CONTAINER_SAS_URL
                  valueFrom:
                    secretKeyRef: { name: maps-targets-storage, key: AZURE_STORAGE_CONTAINER_SAS_URL }
                - name: MAPS_TRACKING_MONGO_URI
                  valueFrom:
                    secretKeyRef: { name: maps-targets-source, key: KEYWORD_MONGO_URI }
                - { name: MAPS_ANDROID_ADB_PATH, value: /runtime/sdk/platform-tools/adb }
                - { name: MAPS_ANDROID_APPIUM_URL, value: "http://127.0.0.1:4723" }
                - { name: MAPS_ANDROID_SERIAL, value: emulator-5554 }
                - { name: HOME, value: /tmp }
                - name: JOB_COMPLETION_INDEX
                  valueFrom:
                    fieldRef: { fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']" }
              resources:
                requests: { cpu: 150m, memory: 512Mi, ephemeral-storage: 512Mi }
                limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 3Gi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                runAsGroup: 1001
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: runtime, mountPath: /runtime/sdk, subPath: sdk, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: config
              configMap: { name: maps-tracking-android-config }
            - name: runtime
              persistentVolumeClaim: { claimName: android-runtime }
            - name: kvm
              hostPath: { path: /dev/kvm, type: CharDevice }
            - { name: work, emptyDir: { sizeLimit: 3Gi } }
            - { name: tmp, emptyDir: { sizeLimit: 1Gi } }
            - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 512Mi } }
