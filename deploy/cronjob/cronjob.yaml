# Daily scheduled batch. The Job it creates is deploy/job/job.yaml with its own keyword ConfigMap,
# an instance label, and no TTL (the history limits below keep finished Jobs, and their logs while the Pod exists).
# tests/deploy-manifests.test.ts fails if the two drift apart, so pin a new image in both files.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-capture-daily
  namespace: dev-ai
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: batch
    app.kubernetes.io/instance: maps-capture-daily
spec:
  # 10:00 New York time every day (22:00 or 23:00 in Shanghai, so an on-time start keeps the same date folder).
  schedule: "0 10 * * *"
  timeZone: America/New_York
  # A scheduled run still going at the next schedule makes that schedule wait. Jobs created by hand
  # (kubectl create job --from, or deploy/job) are not counted, so they can overlap a scheduled run.
  concurrencyPolicy: Forbid
  # A schedule missed by up to an hour (controller restart, previous scheduled run, suspend) still starts.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: maps-keyword-capture
        app.kubernetes.io/component: batch
        app.kubernetes.io/instance: maps-capture-daily
    spec:
      backoffLimit: 0
      # 20 keywords: 60 + 20 * (90 + 30) + 60 = 2520 s application budget, plus margin for the measured
      # per-keyword overshoot and manifest publication. Time spent Pending counts against it.
      activeDeadlineSeconds: 3000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-keyword-capture
            app.kubernetes.io/component: batch
            app.kubernetes.io/instance: maps-capture-daily
        spec:
          restartPolicy: Never
          nodeSelector:
            envpool: aiapp
          automountServiceAccountToken: false
          # Same shutdown budget as deploy/job/job.yaml: about 100 s plus the in-flight round.
          terminationGracePeriodSeconds: 120
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: capture
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:c48e031f03187aee3f3af4665b586d835e49ad21876b4d194fb57d8aad587766
              args: ["node", "dist/cli.js", "--config", "/config/keywords.json", "--storage", "azure"]
              env:
                - name: IMAGE_DIGEST
                  value: sha256:c48e031f03187aee3f3af4665b586d835e49ad21876b4d194fb57d8aad587766
                - name: EGRESS_PROFILE_ID
                  value: aks-fbrdev-eastus2-aiapp
                - name: AZURE_STORAGE_CONTAINER_SAS_URL
                  valueFrom:
                    secretKeyRef:
                      name: maps-keyword-capture-storage
                      key: AZURE_STORAGE_CONTAINER_SAS_URL
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 3Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: config
              configMap:
                name: maps-capture-keywords-daily
            - name: work
              emptyDir: { sizeLimit: 2Gi }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 512Mi }
