apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-search-volume-weekly
  namespace: uat
  labels: {app.kubernetes.io/name: maps-keyword-capture, app.kubernetes.io/component: search-volume}
spec:
  schedule: "30 10 * * 1"
  timeZone: Asia/Shanghai
  suspend: false # Accepted 2026-11-12; see evidence/2026-11-12/search-volume-sync.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0 # Do not repeat paid calls after an ambiguous failure.
      activeDeadlineSeconds: 6600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app.kubernetes.io/name: maps-keyword-capture, app.kubernetes.io/component: search-volume}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector: {envpool: uatops}
          securityContext: {runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001}
          containers:
            - name: sync
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:897cb59a1121af0eaf2db867c353df1f1319f4c5eead7c3d9e6bccb6e8134ea6
              args: [node, dist/volume/cli.js]
              env:
                - {name: TRACKING_CONFIG, value: /config/tracking.json}
                - {name: VOLUME_REGIONS_FILE, value: /config/regions.json}
                - name: MAPS_TRACKING_MONGO_URI
                  valueFrom:
                    secretKeyRef: {name: maps-keyword-monitor-source, key: KEYWORD_MONGO_URI}
                - name: CORE_AI_SERVER
                  valueFrom:
                    secretKeyRef: {name: maps-search-volume-core-ai, key: server}
                - name: CORE_AI_API_KEY
                  valueFrom:
                    secretKeyRef: {name: maps-search-volume-core-ai, key: api-key}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
          volumes:
            - name: config
              configMap: {name: maps-search-volume-v1}
