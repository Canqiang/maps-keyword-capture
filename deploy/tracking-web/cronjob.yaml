# Web rank tracking every two hours at each store's own location (tracking-config/v1 point tier).
# Runs the desktop collector with a map view per batch, delivers evidence to the UAT container and
# upserts RankObservations into MongoDB maps-rank-tracking.observations. See docs/domain.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maps-tracking-web-2h
  namespace: uat
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: tracking-web
spec:
  schedule: "0 */2 * * *"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 12
  failedJobsHistoryLimit: 12
  # Suspended 2026-10-22: Keke's keywords moved into its store configuration and the single targets scan covers them.
  suspend: true
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: maps-keyword-capture
        app.kubernetes.io/component: tracking-web
    spec:
      # Stores are split across indexed pods by a stable hash of storeId (--shard-count must equal completions).
      completionMode: Indexed
      completions: 2
      parallelism: 2
      backoffLimitPerIndex: 0
      maxFailedIndexes: 2
      # About 20 s per keyword per pod; keep each shard under about 250 keywords to finish inside two hours.
      activeDeadlineSeconds: 6600
      # Delete the finished Job and its Pods 10 minutes after it ends (success or failure); results live in Azure/Mongo.
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: maps-keyword-capture
            app.kubernetes.io/component: tracking-web
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
          automountServiceAccountToken: false
          nodeSelector:
            envpool: uatops
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: tracking
              image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:ec39a2bdad8ce3d386f5be3d7d1f34142c0279474d39086a8b6f2e4130621daf
              args: ["node", "dist/domain/cli.js", "scan", "--config", "/config/tracking.json", "--surface", "web", "--tier", "point", "--storage", "azure", "--output-dir", "/work/outputs", "--mongo-uri-env", "MAPS_TRACKING_MONGO_URI", "--shard-count", "2"]
              env:
                - { name: TRACKING_SCAN_GROUP, value: uat/maps-tracking-web-2h }
                - name: JOB_UID
                  valueFrom: { fieldRef: { fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']" } }
                - name: IMAGE_DIGEST
                  value: sha256:ec39a2bdad8ce3d386f5be3d7d1f34142c0279474d39086a8b6f2e4130621daf
                - name: EGRESS_PROFILE_ID
                  value: aks-fbrdev-eastus2-aiapp
                - name: AZURE_STORAGE_CONTAINER
                  value: maps-keyword-capture-uat
                - name: AZURE_STORAGE_CONTAINER_SAS_URL
                  valueFrom:
                    secretKeyRef:
                      name: maps-keyword-monitor-storage
                      key: AZURE_STORAGE_CONTAINER_SAS_URL
                - name: MAPS_TRACKING_MONGO_URI
                  valueFrom:
                    secretKeyRef:
                      name: maps-keyword-monitor-source
                      key: KEYWORD_MONGO_URI
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                  ephemeral-storage: 512Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: work, mountPath: /work }
                - { name: tmp, mountPath: /tmp }
                - { name: dshm, mountPath: /dev/shm }
          volumes:
            - name: config
              configMap:
                name: maps-tracking-config
            - name: work
              emptyDir: { sizeLimit: 2Gi }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
            - name: dshm
              emptyDir: { medium: Memory, sizeLimit: 512Mi }
