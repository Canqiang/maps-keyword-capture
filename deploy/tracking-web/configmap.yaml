# Tracking settings shared by the scans and the UI. Stores live in MongoDB maps-rank-tracking.stores
# and are managed in the tracking UI; deploy/tracking-web/stores-seed.json is the initial import.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maps-tracking-config
  namespace: uat
data:
  tracking.json: |
    {
      "schemaVersion": "tracking-config/v1",
      "timezone": "America/New_York",
      "defaults": {
        "grid": {
          "radiusKm": 5,
          "size": 5
        },
        "zoom": 15
      },
      "stores": [],
      "surfaces": {
        "web": {
          "point": {
            "everyHours": 2,
            "keywords": "all"
          },
          "grid": {
            "enabled": false,
            "atHour": 2,
            "keywords": "core"
          }
        },
        "android": {
          "point": {
            "everyHours": 2,
            "keywords": "core"
          },
          "grid": {
            "enabled": false,
            "atHour": 3,
            "keywords": "core"
          }
        }
      },
      "database": {
        "provider": "mongo",
        "database": "maps-rank-tracking",
        "collection": "observations"
      },
      "storeSource": {
        "provider": "mongo",
        "collection": "stores"
      }
    }
