# Production batch Job. Create a new run with `kubectl create -f` (generateName), not `apply`.
# Artifacts are uploaded to fbrdevstorage/maps-keyword-capture and verified by read-back; the Pod's
# emptyDir is only staging.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: maps-capture-
  namespace: dev-ai
  labels:
    app.kubernetes.io/name: maps-keyword-capture
    app.kubernetes.io/component: batch
spec:
  backoffLimit: 0
  # 20 keywords: 60 + 20 * (90 + 30) + 60 = 2520 s application budget, plus margin for the measured
  # per-keyword overshoot and manifest publication.
  activeDeadlineSeconds: 3000
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maps-keyword-capture
        app.kubernetes.io/component: batch
    spec:
      restartPolicy: Never
      nodeSelector:
        envpool: aiapp
      automountServiceAccountToken: false
      # SIGTERM stops the in-flight keyword at its next round, then results and the manifest are
      # uploaded. Worst case with a stalled storage account: the in-flight round, up to 10 s browser
      # close, two failed persists (15 s upload plus 15 s stalled read-back each), and one
      # final-manifest attempt with its read-back (15 s each), about 100 s plus the round.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: capture
          image: fbrdevacr.azurecr.io/ai/maps-keyword-capture@sha256:c48e031f03187aee3f3af4665b586d835e49ad21876b4d194fb57d8aad587766
          args: ["node", "dist/cli.js", "--config", "/config/keywords.json", "--storage", "azure"]
          env:
            - name: IMAGE_DIGEST
              value: sha256:c48e031f03187aee3f3af4665b586d835e49ad21876b4d194fb57d8aad587766
            - name: EGRESS_PROFILE_ID
              value: aks-fbrdev-eastus2-aiapp
            - name: AZURE_STORAGE_CONTAINER_SAS_URL
              valueFrom:
                secretKeyRef:
                  name: maps-keyword-capture-storage
                  key: AZURE_STORAGE_CONTAINER_SAS_URL
          # The aiapp pool has a fixed 4 nodes (no autoscaler) with little unreserved CPU; 500m fits
          # where 1 core did not (2026-09-17). The measured peak was ~1.1 cores, covered by the limit.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
            - { name: dshm, mountPath: /dev/shm }
      volumes:
        - name: config
          configMap:
            name: maps-capture-keywords
        - name: work
          emptyDir: { sizeLimit: 2Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 512Mi }
